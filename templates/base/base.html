{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        CCMIMS | {% block title %}Catholic Church Member Information and Management System{% endblock %}
    </title>

    <!-- Tailwind CSS v4 + DaisyUI -->
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", function () {

                {% for message in messages %}

                    Swal.fire({
                        icon: "{% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",

                        title: "{% if message.tags == 'success' %}Success{% elif message.tags == 'error' %}Error{% elif message.tags == 'warning' %}Warning{% else %}Information{% endif %}",

                        text: "{{ message|escapejs }}",

                        confirmButtonText: "OK",

                        confirmButtonColor:
                            "{% if message.tags == 'success' %}#16a34a{% else %}#7c3aed{% endif %}",

                        background: "#ffffff",

                        color: "#1f2937"
                    });

                {% endfor %}

            });
        </script>
    {% endif %}

</body>
</html>
