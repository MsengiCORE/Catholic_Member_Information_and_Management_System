{% extends "base/base_with_menu.html" %}

{% block content %}

<div class="p-6">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

        <div>
            <h1 class="text-2xl font-bold text-base-content">
                Parishes
            </h1>

            <p class="text-base-content/60">
                Manage parishes within the diocesan structure.
            </p>
        </div>

        <a
            href="{% url 'members:parish_create' %}"
            class="btn btn-primary"
        >
            + Add Parish
        </a>

    </div>


    <div class="overflow-x-auto bg-gray-200 rounded-box shadow">

        <table id="parishesTable" class="table">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Parish</th>
                    <th>Deanery</th>
                    <th>Diocese</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    new DataTable("#parishesTable", {

        processing: true,

        serverSide: true,

        ajax: {
            url: "{% url 'members:parish_data' %}",
            type: "GET"
        },

        pageLength: 10,

        lengthMenu: [10, 25, 50, 100],

        order: [[1, "asc"]],

        columns: [

            // #
            {
                data: null,
                orderable: false,
                searchable: false,

                render: function (
                    data,
                    type,
                    row,
                    meta
                ) {
                    return (
                        meta.row
                        + meta.settings._iDisplayStart
                        + 1
                    );
                }
            },

            // Parish
            {
                data: "name"
            },

            // Deanery
            {
                data: "deanery"
            },

            // Diocese
            {
                data: "diocese"
            },

            // Description
            {
                data: "description"
            },

            // Status
            {
                data: "status"
            },

            // Actions
            {
                data: null,

                orderable: false,

                searchable: false,

                className: "text-right",

                render: function (
                    data,
                    type,
                    row
                ) {

                    let html = `
                        <div class="flex justify-end gap-2">
                    `;

                    html += `
                        <a
                            href="${row.edit_url}"
                            class="btn btn-sm btn-outline"
                        >
                            Edit
                        </a>
                    `;

                    html += `
                        </div>
                    `;

                    return html;
                }
            }
        ]
    });

});
</script>
{% endblock %}
