{% extends "base/base_with_menu.html" %}

{% block content %}

<div class="min-h-screen bg-gray-200 p-3 sm:p-4 lg:p-6">
    <div class="mx-auto w-full max-w-7xl">

        <!-- Header -->
        <div class="mb-5 flex flex-col gap-4 sm:mb-6 md:flex-row md:items-center md:justify-between">
            <div class="flex min-w-0 items-start gap-3">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-purple-100 text-purple-700 sm:h-11 sm:w-11">
                    <i class="fa-solid fa-people-group text-lg sm:text-xl" aria-hidden="true"></i>
                </div>

                <div class="min-w-0">
                    <h1 class="text-2xl font-bold leading-tight text-base-content sm:text-3xl">
                        Small Christian Communities
                    </h1>
                    <p class="mt-1 text-sm text-base-content/60 sm:text-base">
                        Manage Small Christian Communities within the zone structure.
                    </p>
                </div>
            </div>

            <a
                href="{% url 'members:small_christian_community_create' %}"
                class="btn btn-primary w-full shrink-0 sm:w-auto"
            >
                <i class="fa-solid fa-plus mr-2" aria-hidden="true"></i>
                <span>Add SCC</span>
            </a>
        </div>

        <!-- SCC Table -->
        <div class="w-full overflow-hidden rounded-xl bg-gray-100 shadow">
            <div class="w-full overflow-x-auto">
                <table
                    id="smallChristianCommunitiesTable"
                    class="table w-full min-w-262.5"
                >
                    <thead>
                        <tr>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-hashtag mr-1" aria-hidden="true"></i>
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-people-group mr-1" aria-hidden="true"></i>
                                SCC
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-location-dot mr-1" aria-hidden="true"></i>
                                Zone
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-church mr-1" aria-hidden="true"></i>
                                Parish
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-sitemap mr-1" aria-hidden="true"></i>
                                Deanery
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-church mr-1" aria-hidden="true"></i>
                                Diocese
                            </th>
                            <th class="whitespace-nowrap">
                                <i class="fa-solid fa-circle-check mr-1" aria-hidden="true"></i>
                                Status
                            </th>
                            <th class="whitespace-nowrap text-right">
                                <i class="fa-solid fa-gear mr-1" aria-hidden="true"></i>
                                Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    new DataTable("#smallChristianCommunitiesTable", {
        processing: true,
        serverSide: true,

        ajax: {
            url: "{% url 'members:small_christian_community_data' %}",
            type: "GET"
        },

        pageLength: 10,
        lengthMenu: [10, 25, 50, 100],

        order: [
            [1, "asc"]
        ],

        autoWidth: false,
        responsive: false,

        columns: [

            // #
            {
                data: null,
                orderable: false,
                searchable: false,
                className: "whitespace-nowrap",

                render: function (data, type, row, meta) {
                    return meta.row + meta.settings._iDisplayStart + 1;
                }
            },

            // SCC
            {
                data: "name",

                render: function (data) {
                    return `
                        <span class="inline-flex items-center gap-2 font-semibold">
                            <i class="fa-solid fa-people-group text-purple-600" aria-hidden="true"></i>
                            <span class="break-words">${data ?? "—"}</span>
                        </span>
                    `;
                }
            },

            // Zone
            {
                data: "zone",

                render: function (data) {
                    return `
                        <span class="inline-flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-purple-600" aria-hidden="true"></i>
                            <span class="break-words">${data ?? "—"}</span>
                        </span>
                    `;
                }
            },

            // Parish
            {
                data: "parish",

                render: function (data) {
                    return `
                        <span class="inline-flex items-center gap-2">
                            <i class="fa-solid fa-church text-purple-600" aria-hidden="true"></i>
                            <span class="break-words">${data ?? "—"}</span>
                        </span>
                    `;
                }
            },

            // Deanery
            {
                data: "deanery",

                render: function (data) {
                    return `
                        <span class="inline-flex items-center gap-2">
                            <i class="fa-solid fa-sitemap text-purple-600" aria-hidden="true"></i>
                            <span class="break-words">${data ?? "—"}</span>
                        </span>
                    `;
                }
            },

            // Diocese
            {
                data: "diocese",

                render: function (data) {
                    return `
                        <span class="inline-flex items-center gap-2">
                            <i class="fa-solid fa-church text-purple-600" aria-hidden="true"></i>
                            <span class="break-words">${data ?? "—"}</span>
                        </span>
                    `;
                }
            },

            // Status
            {
                data: "status",

                render: function (data) {
                    const value = String(data ?? "").toLowerCase();

                    if (value === "active") {
                        return `
                            <span class="badge badge-success gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                                Active
                            </span>
                        `;
                    }

                    if (value === "inactive") {
                        return `
                            <span class="badge badge-error gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
                                Inactive
                            </span>
                        `;
                    }

                    return `
                        <span class="badge gap-1 whitespace-nowrap">
                            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                            ${data ?? "—"}
                        </span>
                    `;
                }
            },

            // Actions
            {
                data: "actions",
                orderable: false,
                searchable: false,
                className: "text-right whitespace-nowrap",

                render: function (data) {
                    return data || `
                        <span class="text-gray-400">
                            <i class="fa-solid fa-minus" aria-hidden="true"></i>
                        </span>
                    `;
                }
            }
        ]
    });

});
</script>
{% endblock %}
